<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#1E40AF"/>
    </linearGradient>
  </defs>
  <!-- Sfondo arrotondato -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Corpo calendario (bianco) -->
  <rect x="88" y="144" width="336" height="288" rx="28" fill="white" opacity="0.97"/>
  <!-- Header calendario (blu) -->
  <rect x="88" y="144" width="336" height="92" rx="28" fill="#1D4ED8"/>
  <rect x="88" y="200" width="336" height="36" fill="#1D4ED8"/>
  <!-- Ganci calendario -->
  <rect x="172" y="108" width="32" height="68" rx="16" fill="#93C5FD"/>
  <rect x="308" y="108" width="32" height="68" rx="16" fill="#93C5FD"/>
  <!-- Testo header "REMIND" -->
  <text x="256" y="198" text-anchor="middle" fill="white" font-size="38" font-weight="800"
        font-family="Arial,Helvetica,sans-serif" letter-spacing="4">REMIND</text>
  <!-- Righe griglia -->
  <line x1="88" y1="288" x2="424" y2="288" stroke="#E2E8F0" stroke-width="3"/>
  <line x1="88" y1="344" x2="424" y2="344" stroke="#E2E8F0" stroke-width="3"/>
  <!-- Pallini giorni (tre righe) -->
  <circle cx="152" cy="317" r="10" fill="#BFDBFE"/>
  <circle cx="214" cy="317" r="10" fill="#BFDBFE"/>
  <circle cx="276" cy="317" r="10" fill="#BFDBFE"/>
  <circle cx="152" cy="373" r="10" fill="#BFDBFE"/>
  <circle cx="214" cy="373" r="10" fill="#BFDBFE"/>
  <!-- Cerchio checkmark (verde) -->
  <circle cx="352" cy="373" r="64" fill="#10B981"/>
  <circle cx="352" cy="373" r="58" fill="#059669"/>
  <!-- Checkmark -->
  <path d="M320 373 L344 398 L392 345" stroke="white" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
