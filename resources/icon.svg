<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 80 80">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
  </defs>

  <!-- Sfondo -->
  <rect width="80" height="80" rx="18" fill="url(#bg)"/>

  <!-- Corpo calendario -->
  <rect x="14" y="20" width="52" height="44" rx="8" fill="#ffffff" fill-opacity="0.15"/>
  <rect x="14" y="20" width="52" height="44" rx="8" fill="none" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Header calendario -->
  <rect x="14" y="20" width="52" height="16" rx="8" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="14" y="28" width="52" height="8"  fill="#ffffff" fill-opacity="0.25"/>

  <!-- Gambe calendario -->
  <line x1="27" y1="15" x2="27" y2="26" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="53" y1="15" x2="53" y2="26" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Cerchio check verde -->
  <circle cx="40" cy="50" r="14" fill="#10B981" fill-opacity="0.95"/>

  <!-- Checkmark -->
  <polyline points="33,50 38,55 48,44"
            fill="none"
            stroke="#ffffff"
            stroke-width="3.5"
            stroke-linecap="round"
            stroke-linejoin="round"/>
</svg>
