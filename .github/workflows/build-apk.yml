name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CACHE_BUST: "1"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install dependencies
      run: npm install

    - name: Build web app
      run: npm run build

    - name: Install Capacitor CLI globally
      run: npm install -g @capacitor/cli

    - name: Install Capacitor dependencies
      run: npm install @capacitor/core @capacitor/android --save-dev

    - name: Add Android platform
      run: npx cap add android || true

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Fix Gradle version (Issue #8314 - AGP 9 incompatible)
      run: |
        GRADLE_PROPS="android/gradle/wrapper/gradle-wrapper.properties"
        echo "=== BEFORE Gradle fix ==="
        cat "$GRADLE_PROPS" || echo "FILE NOT FOUND"
        if [ -f "$GRADLE_PROPS" ]; then
          # Rewrite the file completely with Gradle 8.14.3 (Java properties format with escaped colons)
          cat > "$GRADLE_PROPS" <<'PROPS_EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        PROPS_EOF
          # Strip leading 8 spaces (YAML indent)
          sed -i 's/^        //' "$GRADLE_PROPS"
          echo "=== AFTER Gradle fix ==="
          cat "$GRADLE_PROPS"
        else
          echo "ERROR: gradle-wrapper.properties not found at $GRADLE_PROPS"
          ls -la android/gradle/wrapper/ 2>/dev/null || ls -la android/ 2>/dev/null
          exit 1
        fi

    - name: Pin AGP to 8.12.2 (Issue #8292 - Capacitor 8 max AGP)
      run: |
        VARIABLES_GRADLE="android/variables.gradle"
        BUILD_GRADLE="android/build.gradle"
        echo "=== variables.gradle BEFORE ==="
        cat "$VARIABLES_GRADLE" 2>/dev/null || echo "not found"
        echo "=== build.gradle BEFORE (classpath section) ==="
        grep -n "com.android.tools.build:gradle" "$BUILD_GRADLE" || echo "not found"
        # Force AGP version in build.gradle classpath
        if grep -q "com.android.tools.build:gradle" "$BUILD_GRADLE"; then
          sed -i 's|com.android.tools.build:gradle:[0-9][0-9.]*|com.android.tools.build:gradle:8.12.2|g' "$BUILD_GRADLE"
          echo "=== build.gradle AFTER (classpath section) ==="
          grep -n "com.android.tools.build:gradle" "$BUILD_GRADLE"
        fi
        # Also pin androidGradlePluginVersion in variables.gradle if present
        if [ -f "$VARIABLES_GRADLE" ] && grep -q "androidGradlePluginVersion" "$VARIABLES_GRADLE"; then
          sed -i "s|androidGradlePluginVersion = ['\"][0-9][0-9.]*['\"]|androidGradlePluginVersion = '8.12.2'|g" "$VARIABLES_GRADLE"
          echo "=== variables.gradle AFTER ==="
          cat "$VARIABLES_GRADLE"
        fi

    - name: Fix proguard config (Issue #8314 - proguard-android.txt deprecated)
      run: |
        APP_BUILD_GRADLE="android/app/build.gradle"
        echo "=== app/build.gradle proguard BEFORE ==="
        grep -n "proguard" "$APP_BUILD_GRADLE" || echo "no proguard lines"
        # Replace proguard-android.txt with proguard-android-optimize.txt (defensive)
        sed -i "s|getDefaultProguardFile('proguard-android.txt')|getDefaultProguardFile('proguard-android-optimize.txt')|g" "$APP_BUILD_GRADLE"
        echo "=== app/build.gradle proguard AFTER ==="
        grep -n "proguard" "$APP_BUILD_GRADLE" || echo "no proguard lines"

    - name: Add server_client_id to strings.xml (for GoogleAuth plugin)
      run: |
        STRINGS_FILE="android/app/src/main/res/values/strings.xml"
        WEB_CLIENT_ID="837673127946-ec145h4fjbp66mqgedngkcv8c6vaf7gp.apps.googleusercontent.com"
        if ! grep -q "server_client_id" "$STRINGS_FILE"; then
          sed -i "s|</resources>|    <string name=\"server_client_id\">${WEB_CLIENT_ID}</string>\n</resources>|" "$STRINGS_FILE"
          echo "Added server_client_id to strings.xml"
        else
          echo "server_client_id already present"
        fi
        echo "=== strings.xml content ==="
        cat "$STRINGS_FILE"

    - name: Copy debug keystore and verify SHA-1
      run: |
        mkdir -p ~/.android
        cp debug.keystore ~/.android/debug.keystore
        echo "=== SHA-1 of our debug.keystore ==="
        keytool -list -v -keystore debug.keystore -storepass android 2>&1 | grep -E "SHA1:|Alias name:" || true
        echo "=== Keystore file info ==="
        ls -la debug.keystore ~/.android/debug.keystore

    - name: Inject explicit signingConfigs into build.gradle
      run: |
        KEYSTORE_ABS="$(realpath debug.keystore)"
        echo "Using keystore: $KEYSTORE_ABS"
        BUILD_GRADLE="android/app/build.gradle"
        echo "=== BEFORE PATCH ==="
        cat "$BUILD_GRADLE"
        # Create the signing config block using envsubst-safe placeholder
        SIGNING_BLOCK="    signingConfigs {\n        debug {\n            storeFile file('${KEYSTORE_ABS}')\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n    }\n"
        # Remove any existing signingConfigs block (simple case: single block)
        # Then inject the new one before buildTypes
        if grep -q "signingConfigs" "$BUILD_GRADLE"; then
          echo "signingConfigs block already present - replacing storeFile path only"
          sed -i "s|storeFile file(.*)|storeFile file('${KEYSTORE_ABS}')|g" "$BUILD_GRADLE"
        else
          echo "Adding new signingConfigs block before buildTypes"
          # Use awk to inject signingConfigs BEFORE the first buildTypes line
          awk -v block="$SIGNING_BLOCK" '
            /buildTypes[[:space:]]*\{/ && !done {
              printf "%s", block;
              done = 1;
            }
            { print }
          ' "$BUILD_GRADLE" > "${BUILD_GRADLE}.new"
          mv "${BUILD_GRADLE}.new" "$BUILD_GRADLE"
        fi
        # Ensure debug buildType references signingConfigs.debug
        if ! grep -q "signingConfig signingConfigs.debug" "$BUILD_GRADLE"; then
          echo "Adding signingConfig signingConfigs.debug to debug buildType"
          # Inject into existing debug block, or create one
          if awk '/buildTypes[[:space:]]*\{/,/^[[:space:]]*\}[[:space:]]*$/' "$BUILD_GRADLE" | grep -q "debug[[:space:]]*{"; then
            sed -i '/buildTypes[[:space:]]*{/,/^[[:space:]]*}[[:space:]]*$/ s/debug[[:space:]]*{/debug {\n            signingConfig signingConfigs.debug/' "$BUILD_GRADLE"
          else
            sed -i 's|buildTypes[[:space:]]*{|buildTypes {\n        debug {\n            signingConfig signingConfigs.debug\n        }|' "$BUILD_GRADLE"
          fi
        fi
        echo "=== AFTER PATCH ==="
        cat "$BUILD_GRADLE"

    - name: Environment debug dump
      run: |
        set +e
        echo "=== JAVA VERSION ==="
        java -version
        echo "=== GRADLE WRAPPER VERSION ==="
        cat android/gradle/wrapper/gradle-wrapper.properties | grep -i gradle || true
        echo "=== NPM VERSIONS (peer dep mismatch warnings are non-fatal) ==="
        npm ls @capacitor/android @capacitor/cli @capacitor/core --depth=0 2>&1 | head -20 || true
        echo "=== ANDROID SDK ==="
        ls -la "$ANDROID_HOME" 2>/dev/null | head -10 || echo "ANDROID_HOME not set"
        echo "=== CAPACITOR ANDROID PLUGIN ==="
        ls -la android/capacitor-cordova-android-plugins/ 2>/dev/null | head || echo "Not found"
        # Always exit successfully - this step is informational only
        exit 0

    - name: Build APK (Debug)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean
        ./gradlew assembleDebug -x lint

    - name: Verify APK signature SHA-1
      run: |
        APK="android/app/build/outputs/apk/debug/app-debug.apk"
        echo "=== APK location: $APK ==="
        ls -la "$APK"
        echo "=== APK actual signing SHA-1 (from keytool -printcert) ==="
        unzip -p "$APK" META-INF/*.RSA | keytool -printcert 2>&1 | grep -iE "SHA1:|SHA-1:|Owner:" || true
        echo "=== Expected SHA-1: E1:7D:7F:18:34:BB:90:43:F3:19:FD:0B:2F:9F:19:C4:A8:1E:F9:17 ==="

    - name: Upload APK to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: android/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
