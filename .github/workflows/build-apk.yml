name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install dependencies
      run: npm install

    - name: Build web app
      run: npm run build

    - name: Add Android platform
      run: npx cap add android || true

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Add server_client_id to strings.xml
      run: |
        STRINGS_FILE="android/app/src/main/res/values/strings.xml"
        WEB_CLIENT_ID="837673127946-ec145h4fjbp66mqgedngkcv8c6vaf7gp.apps.googleusercontent.com"
        if grep -q "server_client_id" "$STRINGS_FILE" 2>/dev/null; then
          echo "server_client_id already present"
        else
          sed -i "s|</resources>|    <string name=\"server_client_id\">${WEB_CLIENT_ID}</string>\n</resources>|" "$STRINGS_FILE"
          echo "Added server_client_id to strings.xml"
        fi

    - name: Inject google-services.json (placeholder if no secret)
      run: |
        DEST="android/app/google-services.json"
        if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" ]; then
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > "$DEST"
          echo "✅ google-services.json from secret"
        else
          printf '%s\n' \
            '{' \
            '  "project_info": {' \
            '    "project_number": "000000000000",' \
            '    "project_id": "placeholder-project",' \
            '    "storage_bucket": "placeholder-project.appspot.com"' \
            '  },' \
            '  "client": [{' \
            '    "client_info": {' \
            '      "mobilesdk_app_id": "1:000000000000:android:0000000000000000",' \
            '      "android_client_info": { "package_name": "com.scadenze.app" }' \
            '    },' \
            '    "oauth_client": [],' \
            '    "api_key": [{ "current_key": "placeholder" }],' \
            '    "services": { "appinvite_service": { "other_platform_oauth_client": [] } }' \
            '  }],' \
            '  "configuration_version": "1"' \
            '}' > "$DEST"
          echo "ℹ️ Using placeholder google-services.json (FCM disabled)"
        fi

    - name: Generate Android icons from SVG
      run: |
        sudo apt-get install -y librsvg2-bin -q > /dev/null 2>&1 || true
        ICON_SVG="resources/icon.svg"
        if [ ! -f "$ICON_SVG" ] || ! command -v rsvg-convert > /dev/null 2>&1; then
          echo "⚠️ Skipping icon generation (SVG or rsvg-convert not available)"
          exit 0
        fi
        DIRS=(mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi)
        SIZES=(48 72 96 144 192)
        for i in 0 1 2 3 4; do
          DEST="android/app/src/main/res/${DIRS[$i]}"
          mkdir -p "$DEST"
          rsvg-convert -w ${SIZES[$i]} -h ${SIZES[$i]} "$ICON_SVG" -o "$DEST/ic_launcher.png"
          cp "$DEST/ic_launcher.png" "$DEST/ic_launcher_round.png"
        done
        echo "✅ Icons generated"

    - name: Show build.gradle before build (for diagnostics)
      run: |
        echo "=== android/variables.gradle ==="
        cat android/variables.gradle 2>/dev/null || echo "NOT FOUND"
        echo "=== android/app/build.gradle ==="
        cat android/app/build.gradle 2>/dev/null || echo "NOT FOUND"

    - name: Build APK (Debug)
      id: build_apk
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug -x lint 2>&1 | tee /tmp/gradle-build.log
      continue-on-error: true

    - name: Write build result to summary
      if: always()
      run: |
        {
          if [ "${{ steps.build_apk.outcome }}" = "success" ]; then
            echo "# ✅ Build SUCCESS"
          else
            echo "# ❌ Build FAILED"
          fi
          echo ""
          echo "## Gradle output (last 100 lines)"
          echo '```'
          tail -100 /tmp/gradle-build.log 2>/dev/null || echo "(no log)"
          echo '```'
          echo ""
          echo "## Errors"
          echo '```'
          grep -iE "error:|FAILED|Exception|Could not|What went wrong" /tmp/gradle-build.log 2>/dev/null | head -50 || echo "(none)"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload Gradle logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-logs
        path: /tmp/gradle-build.log
        retention-days: 7

    - name: Fail build if Gradle failed
      if: steps.build_apk.outcome != 'success'
      run: exit 1

    - name: Upload APK
      if: steps.build_apk.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/') && steps.build_apk.outcome == 'success'
      uses: softprops/action-gh-release@v1
      with:
        files: android/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
