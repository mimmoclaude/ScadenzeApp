name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install dependencies
      run: npm install

    - name: Build web app
      run: npm run build

    - name: Install Capacitor CLI globally
      run: npm install -g @capacitor/cli

    - name: Install Capacitor dependencies
      run: npm install @capacitor/core @capacitor/android --save-dev

    - name: Add Android platform
      run: npx cap add android || true

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Add server_client_id to strings.xml (for GoogleAuth plugin)
      run: |
        STRINGS_FILE="android/app/src/main/res/values/strings.xml"
        WEB_CLIENT_ID="837673127946-ec145h4fjbp66mqgedngkcv8c6vaf7gp.apps.googleusercontent.com"
        if ! grep -q "server_client_id" "$STRINGS_FILE"; then
          sed -i "s|</resources>|    <string name=\"server_client_id\">${WEB_CLIENT_ID}</string>\n</resources>|" "$STRINGS_FILE"
          echo "Added server_client_id to strings.xml"
        else
          echo "server_client_id already present"
        fi
        echo "=== strings.xml content ==="
        cat "$STRINGS_FILE"

    - name: Copy debug keystore and verify SHA-1
      run: |
        mkdir -p ~/.android
        cp debug.keystore ~/.android/debug.keystore
        echo "=== SHA-1 of our debug.keystore ==="
        keytool -list -v -keystore debug.keystore -storepass android 2>&1 | grep -E "SHA1:|Alias name:" || true
        echo "=== Keystore file info ==="
        ls -la debug.keystore ~/.android/debug.keystore

    - name: Patch build.gradle to use explicit keystore path
      run: |
        KEYSTORE_ABS="$(realpath debug.keystore)"
        echo "Using keystore: $KEYSTORE_ABS"
        # Inject explicit debug signing config into build.gradle
        sed -i "s|storeFile file.*|storeFile file('$KEYSTORE_ABS')|g" android/app/build.gradle || true
        grep -A5 "signingConfigs" android/app/build.gradle || echo "signingConfigs not found (using default)"

    - name: Build APK (Debug)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean
        ./gradlew assembleDebug -x lint

    - name: Verify APK signature SHA-1
      run: |
        APK="android/app/build/outputs/apk/debug/app-debug.apk"
        echo "=== APK location: $APK ==="
        ls -la "$APK"
        echo "=== APK actual signing SHA-1 (from keytool -printcert) ==="
        unzip -p "$APK" META-INF/*.RSA | keytool -printcert 2>&1 | grep -iE "SHA1:|SHA-1:|Owner:" || true
        echo "=== Expected SHA-1: E1:7D:7F:18:34:BB:90:43:F3:19:FD:0B:2F:9F:19:C4:A8:1E:F9:17 ==="

    - name: Upload APK to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: android/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
