name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install dependencies
      run: npm install

    - name: Build web app
      run: npm run build

    - name: Install Capacitor CLI globally
      run: npm install -g @capacitor/cli

    - name: Install Capacitor dependencies
      run: npm install @capacitor/core @capacitor/android --save-dev

    - name: Add Android platform
      run: npx cap add android || true

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Generate Android app icons from SVG (icon #9 - Calendario + Check)
      run: |
        sudo apt-get install -y librsvg2-bin imagemagick 2>/dev/null | tail -3

        ICON_SVG="resources/icon.svg"

        if [ ! -f "$ICON_SVG" ]; then
          echo "⚠️ $ICON_SVG non trovato - skip generazione icone"
        else
          echo "✅ Trovato $ICON_SVG - generazione icone Android..."

          # Coppie: directory → dimensione px
          declare -A SIZES=(
            ["mipmap-mdpi"]=48
            ["mipmap-hdpi"]=72
            ["mipmap-xhdpi"]=96
            ["mipmap-xxhdpi"]=144
            ["mipmap-xxxhdpi"]=192
          )

          for dir in "${!SIZES[@]}"; do
            SIZE="${SIZES[$dir]}"
            DEST="android/app/src/main/res/$dir"
            mkdir -p "$DEST"

            # Icona quadrata standard
            rsvg-convert -w $SIZE -h $SIZE "$ICON_SVG" -o "$DEST/ic_launcher.png"
            echo "  ✓ $dir/ic_launcher.png (${SIZE}x${SIZE})"

            # Icona round: applica maschera circolare con ImageMagick
            rsvg-convert -w $SIZE -h $SIZE "$ICON_SVG" -o /tmp/icon_tmp.png
            convert /tmp/icon_tmp.png \
              \( +clone -alpha extract \
                 -draw "fill black polygon 0,0 0,${SIZE} ${SIZE},${SIZE} ${SIZE},0 \
                        fill white circle $((SIZE/2)),$((SIZE/2)) $((SIZE/2)),0" \
                 \( +clone -flip \) -compose multiply -composite \
                 \( +clone -flop \) -compose multiply -composite \
              \) -alpha off -compose CopyOpacity -composite \
              "$DEST/ic_launcher_round.png" 2>/dev/null || \
              cp /tmp/icon_tmp.png "$DEST/ic_launcher_round.png"
            echo "  ✓ $dir/ic_launcher_round.png (${SIZE}x${SIZE})"
          done

          # Icona foreground per adaptive icon (108dp = 432px a xxxhdpi, con padding 18%)
          ADAPT_SIZE=432
          ADAPT_DEST="android/app/src/main/res/drawable"
          mkdir -p "$ADAPT_DEST"
          rsvg-convert -w $ADAPT_SIZE -h $ADAPT_SIZE "$ICON_SVG" -o "$ADAPT_DEST/ic_launcher_foreground.png"
          echo "  ✓ drawable/ic_launcher_foreground.png (${ADAPT_SIZE}x${ADAPT_SIZE})"

          # Background solido per adaptive icon
          convert -size ${ADAPT_SIZE}x${ADAPT_SIZE} \
            gradient:"#6366F1-#312E81" \
            "$ADAPT_DEST/ic_launcher_background.png" 2>/dev/null || \
            rsvg-convert -w $ADAPT_SIZE -h $ADAPT_SIZE "$ICON_SVG" -o "$ADAPT_DEST/ic_launcher_background.png"
          echo "  ✓ drawable/ic_launcher_background.png (background gradient)"

          echo "✅ Tutte le icone generate con successo"
        fi

    - name: Inject google-services.json from GitHub Secret (FCM/Firebase)
      run: |
        DEST="android/app/google-services.json"
        if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" ]; then
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > "$DEST"
          echo "✅ google-services.json iniettato da Secret"
          # Sanity check
          cat "$DEST" | python3 -c "import sys, json; d=json.load(sys.stdin); print('project_id:', d['project_info']['project_id'])"
        else
          echo "⚠️ GOOGLE_SERVICES_JSON_B64 non impostato - FCM disabilitato in questa build"
          # Crea un google-services.json minimo placeholder per permettere la compilazione
          cat > "$DEST" << 'PLACEHOLDER_EOF'
        {
          "project_info": {
            "project_number": "000000000000",
            "project_id": "placeholder-project",
            "storage_bucket": "placeholder-project.appspot.com"
          },
          "client": [{
            "client_info": {
              "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
              "android_client_info": { "package_name": "com.scadenze.app" }
            },
            "oauth_client": [],
            "api_key": [{ "current_key": "placeholder" }],
            "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
          }],
          "configuration_version": "1"
        }
        PLACEHOLDER_EOF
          echo "ℹ️ Usato google-services.json placeholder (solo build - push non funzioneranno)"
        fi

    - name: Add server_client_id to strings.xml (for GoogleAuth plugin)
      run: |
        STRINGS_FILE="android/app/src/main/res/values/strings.xml"
        WEB_CLIENT_ID="837673127946-ec145h4fjbp66mqgedngkcv8c6vaf7gp.apps.googleusercontent.com"
        if ! grep -q "server_client_id" "$STRINGS_FILE"; then
          sed -i "s|</resources>|    <string name=\"server_client_id\">${WEB_CLIENT_ID}</string>\n</resources>|" "$STRINGS_FILE"
          echo "Added server_client_id to strings.xml"
        else
          echo "server_client_id already present"
        fi
        echo "=== strings.xml content ==="
        cat "$STRINGS_FILE"

    - name: Copy debug keystore and verify SHA-1
      run: |
        mkdir -p ~/.android
        cp debug.keystore ~/.android/debug.keystore
        echo "=== SHA-1 of our debug.keystore ==="
        keytool -list -v -keystore debug.keystore -storepass android 2>&1 | grep -E "SHA1:|Alias name:" || true
        echo "=== Keystore file info ==="
        ls -la debug.keystore ~/.android/debug.keystore

    - name: Inject explicit signingConfigs into build.gradle
      run: |
        KEYSTORE_ABS="$(realpath debug.keystore)"
        echo "Using keystore: $KEYSTORE_ABS"
        BUILD_GRADLE="android/app/build.gradle"
        echo "=== BEFORE PATCH ==="
        cat "$BUILD_GRADLE"
        # Create the signing config block using envsubst-safe placeholder
        SIGNING_BLOCK="    signingConfigs {\n        debug {\n            storeFile file('${KEYSTORE_ABS}')\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n    }\n"
        # Remove any existing signingConfigs block (simple case: single block)
        # Then inject the new one before buildTypes
        if grep -q "signingConfigs" "$BUILD_GRADLE"; then
          echo "signingConfigs block already present - replacing storeFile path only"
          sed -i "s|storeFile file(.*)|storeFile file('${KEYSTORE_ABS}')|g" "$BUILD_GRADLE"
        else
          echo "Adding new signingConfigs block before buildTypes"
          # Use awk to inject signingConfigs BEFORE the first buildTypes line
          awk -v block="$SIGNING_BLOCK" '
            /buildTypes[[:space:]]*\{/ && !done {
              printf "%s", block;
              done = 1;
            }
            { print }
          ' "$BUILD_GRADLE" > "${BUILD_GRADLE}.new"
          mv "${BUILD_GRADLE}.new" "$BUILD_GRADLE"
        fi
        # Ensure debug buildType references signingConfigs.debug
        if ! grep -q "signingConfig signingConfigs.debug" "$BUILD_GRADLE"; then
          echo "Adding signingConfig signingConfigs.debug to debug buildType"
          # Inject into existing debug block, or create one
          if awk '/buildTypes[[:space:]]*\{/,/^[[:space:]]*\}[[:space:]]*$/' "$BUILD_GRADLE" | grep -q "debug[[:space:]]*{"; then
            sed -i '/buildTypes[[:space:]]*{/,/^[[:space:]]*}[[:space:]]*$/ s/debug[[:space:]]*{/debug {\n            signingConfig signingConfigs.debug/' "$BUILD_GRADLE"
          else
            sed -i 's|buildTypes[[:space:]]*{|buildTypes {\n        debug {\n            signingConfig signingConfigs.debug\n        }|' "$BUILD_GRADLE"
          fi
        fi
        echo "=== AFTER PATCH ==="
        cat "$BUILD_GRADLE"

    - name: Add Firebase dependencies to Android project (for FCM)
      run: |
        ROOT_GRADLE="android/build.gradle"
        APP_GRADLE="android/app/build.gradle"

        # Aggiungi Google Services classpath nel root build.gradle se non presente
        if ! grep -q "google-services" "$ROOT_GRADLE"; then
          sed -i "s|dependencies {|dependencies {\n        classpath 'com.google.gms:google-services:4.4.0'|" "$ROOT_GRADLE"
          echo "✅ Aggiunto google-services classpath a $ROOT_GRADLE"
        else
          echo "ℹ️ google-services già presente in $ROOT_GRADLE"
        fi

        # Applica il plugin google-services all'app se non presente
        if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
          echo "" >> "$APP_GRADLE"
          echo "apply plugin: 'com.google.gms.google-services'" >> "$APP_GRADLE"
          echo "✅ Aggiunto 'apply plugin: com.google.gms.google-services' a $APP_GRADLE"
        else
          echo "ℹ️ google-services plugin già presente in $APP_GRADLE"
        fi

        echo "=== Root build.gradle dependencies ==="
        grep -A5 "dependencies {" "$ROOT_GRADLE" | head -20 || true

    - name: Build APK (Debug)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean
        ./gradlew assembleDebug -x lint

    - name: Verify APK signature SHA-1
      run: |
        APK="android/app/build/outputs/apk/debug/app-debug.apk"
        echo "=== APK location: $APK ==="
        ls -la "$APK"
        echo "=== APK actual signing SHA-1 (from keytool -printcert) ==="
        unzip -p "$APK" META-INF/*.RSA | keytool -printcert 2>&1 | grep -iE "SHA1:|SHA-1:|Owner:" || true
        echo "=== Expected SHA-1: E1:7D:7F:18:34:BB:90:43:F3:19:FD:0B:2F:9F:19:C4:A8:1E:F9:17 ==="

    - name: Upload APK to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: android/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
